<!DOCTYPE html>
<html>
    <head>
        <title>Exercise One ECMAScript</title>
    </head>
    <body>
        <p>Result in console</p>

        <!--ECMAScript code-->
        <script>

            const bookData = [
                { title: "Harry Potter and the Philosophers Stone", author: "J. K. Rowling", pYear: 1997 },
                { title: "Harry Potter and the Chamber of Secrets", author: "J. K. Rowling", pYear: 1998 },
                { title: "Harry Potter and the Prisoner of Azkaban", author: "J. K. Rowling", pYear: 1999 },
            ];

            class Book {
                constructor(title, author, pYear){
                    this.title = title;
                    this.author = author;
                    this.pYear = pYear;
                }

                getBookInfo(){
                    console.log(`${this.title} by ${this.author}, published in ${this.pYear}`);
                }
            }

            // mapping out the array of bookData objects to correctly be added into the class Book. 
            // Alterative from a foreach-loop
            function mapBookData(book) {
                return book.map(bookData => new Book(bookData.title, bookData.author, bookData.pYear));
            }
            // executing function
            const addBooks = mapBookData(bookData);
            // printing out all books in the console
            addBooks.forEach(book => book.getBookInfo());


            // Second part of exercise, making a library
            class Library {
                constructor(name, books = []){
                    this.name = name;
                    this.books = books;
                }

                addBook(book) {
                    this.books.push(book);
                }

                removeBook(bookTitle) {
                    this.books = this.books.filter(book => book.title !== bookTitle);
                }

                listBooks() {
                    this.books.forEach(book => {
                        console.log(`${book.title} by ${book.author}, published in ${book.pYear}`);
                    });
                }
            }

            const book1 = { title: "Twilight", author: "Stephenie Meyer", pYear: 2005 };
            const book2 = { title: "New Moon", author: "Stephenie Meyer", pYear: 2006 };
            const book3 = { title: "Eclipse", author: "Stephenie Meyer", pYear: 2007 };
            const book4 = { title: "Breaking Dawn", author: "Stephenie Meyer", pYear: 2008 };
            const book5 = { title: "Midnight Sun", author: "Stephenie Meyer", pYear: 2020 };

            const lib = new Library("Vampire Library", [book1, book2, book3, book4]);
            console.log(lib.name);
            lib.listBooks();

            // add one book to Vampire Library
            lib.addBook(book5);
            console.log(`${book5.author}'s new book ${book5.title} now ADDED at ${lib.name}!`);
            lib.listBooks();

            // remove one book from Vampire Library
            lib.removeBook(book3.title);
            console.log(`${book5.author}'s book ${book3.title} REMOVED from ${lib.name}!`);
            lib.listBooks();
        </script>
    </body>
</html>
